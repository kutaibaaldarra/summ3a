<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب | سمعة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <!-- EmailJS SDK (مجاني 200 إيميل/شهر) -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <!-- jsPDF لإنشاء الفاتورة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
    (function(){ emailjs.init("YOUR_EMAILJS_PUBLIC_KEY"); })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background: #070707; color: #fff; min-height: 100vh; }
        .bg-glow { position: fixed; top: -30%; right: -15%; width: 50%; height: 70%; background: radial-gradient(circle, rgba(246,135,32,0.04), transparent 70%); pointer-events: none; z-index: 0; }

        .card { background: linear-gradient(145deg, #141414, #0a0a0a); border: 1px solid rgba(246,135,32,0.08); border-radius: 1.5rem; padding: 2rem; }
        .card-sm { background: linear-gradient(145deg, #141414, #0a0a0a); border: 1px solid rgba(246,135,32,0.06); border-radius: 1rem; padding: 1.25rem; }

        .input { background: #111; border: 1px solid rgba(255,255,255,0.06); border-radius: 1rem; color: #fff; padding: 1rem 1.25rem; width: 100%; transition: all 0.3s ease; font-family: 'Tajawal', sans-serif; font-size: 1rem; }
        .input:focus { outline: none; border-color: #f68720; box-shadow: 0 0 20px rgba(246,135,32,0.08); }
        .input::placeholder { color: #555; }
        .input.error { border-color: #ef4444; }

        .btn { padding: 1rem 2rem; border-radius: 1rem; font-weight: 700; font-size: 1rem; transition: all 0.3s ease; cursor: pointer; border: none; font-family: 'Tajawal', sans-serif; }
        .btn-primary { background: linear-gradient(135deg, #f68720, #e0781c); color: #000; width: 100%; }
        .btn-primary:hover { box-shadow: 0 0 30px rgba(246,135,32,0.25); transform: translateY(-2px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #aaa; display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; }
        .btn-ghost:hover { border-color: #f68720; color: #f68720; }
        .btn-success { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; }

        .feature-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; color: #ccc; font-size: 0.9rem; }
        .feature-item .check { color: #22c55e; font-weight: 700; flex-shrink: 0; }

        .fade-in { animation: fi 0.4s ease both; }
        @keyframes fi { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .success-icon { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #f68720, #e0781c); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; font-size: 2.5rem; }

        .checkbox-wrap { display: flex; align-items: flex-start; gap: 0.75rem; }
        .checkbox-wrap input[type="checkbox"] { width: 1.2rem; height: 1.2rem; margin-top: 0.15rem; accent-color: #f68720; cursor: pointer; flex-shrink: 0; }
        .checkbox-wrap label { color: #888; font-size: 0.85rem; cursor: pointer; }
        .checkbox-wrap a { color: #f68720; text-decoration: none; }
        .checkbox-wrap a:hover { text-decoration: underline; }

        .invoice-preview { background: #0a0a0a; border: 1px solid rgba(255,255,255,0.04); border-radius: 1rem; padding: 1.5rem; }
        .invoice-preview .row { display: flex; justify-content: space-between; padding: 0.5rem 0; color: #ccc; font-size: 0.9rem; }
        .invoice-preview .row.total { border-top: 1px solid rgba(255,255,255,0.08); margin-top: 0.5rem; padding-top: 0.75rem; color: #f68720; font-weight: 700; font-size: 1.1rem; }

        @media (max-width: 768px) { .card { padding: 1.25rem; } .checkout-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="bg-glow"></div>

<div class="page" style="position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:2rem 1rem">

    <!-- Header -->
    <div class="fade-in" style="display:flex;align-items:center;gap:1rem;margin-bottom:2rem;flex-wrap:wrap">
        <a href="packages.html" style="color:#666;text-decoration:none;font-size:1.2rem">→</a>
        <img src="images/3.png" alt="" style="width:2.5rem;height:2.5rem;border-radius:0.6rem;border:2px solid rgba(246,135,32,0.15)">
        <div><h1 style="font-size:1.3rem;font-weight:900">إتمام الطلب</h1></div>
    </div>

    <!-- Main -->
    <div id="checkout-page">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem" class="checkout-grid">

            <!-- Left: Package Info + Invoice Preview -->
            <div class="card fade-in">
                <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:1rem">
                    <div>
                        <span style="color:#888;font-size:0.85rem">الباقة المختارة</span>
                        <h2 id="pkg-name" style="font-size:1.8rem;font-weight:900;color:#f68720">-</h2>
                    </div>
                    <div id="pkg-badge" style="background:rgba(246,135,32,0.1);padding:0.3rem 0.8rem;border-radius:999px;font-size:0.8rem;font-weight:700;color:#f68720"></div>
                </div>
                <div style="font-size:2.5rem;font-weight:900;margin-bottom:0.25rem" id="pkg-price">-</div>
                <div style="color:#888;font-size:0.9rem;margin-bottom:1rem" id="pkg-duration">-</div>

                <div style="border-top:1px solid rgba(255,255,255,0.05);padding-top:1rem">
                    <div style="font-weight:700;margin-bottom:0.75rem">المميزات:</div>
                    <div id="pkg-features"></div>
                </div>

                <!-- فاتورة معاينة -->
                <div style="border-top:1px solid rgba(255,255,255,0.05);padding-top:1rem;margin-top:1rem">
                    <div style="font-weight:700;margin-bottom:0.75rem;color:#f68720">📄 فاتورة الطلب</div>
                    <div class="invoice-preview" id="invoice-preview">
                        <div class="row"><span>الخدمة</span><span id="inv-service">-</span></div>
                        <div class="row"><span>المدة</span><span id="inv-duration">-</span></div>
                        <div class="row total"><span>الإجمالي</span><span id="inv-total">-</span></div>
                    </div>
                </div>
            </div>

            <!-- Right: Form -->
            <div class="card fade-in" style="animation-delay:0.1s">
                <h3 style="font-weight:700;margin-bottom:1.5rem">معلومات التواصل</h3>
                <form id="checkout-form" onsubmit="return false" style="display:flex;flex-direction:column;gap:1rem">
                    <input type="text" id="cf-name" class="input" placeholder="الاسم الكامل *" required>
                    <input type="tel" id="cf-phone" class="input" placeholder="رقم الجوال *" required>
                    <input type="email" id="cf-email" class="input" placeholder="البريد الإلكتروني *" required>
                    <textarea id="cf-notes" class="input" placeholder="ملاحظات إضافية..." style="resize:none;height:80px"></textarea>

                    <div style="border-top:1px solid rgba(255,255,255,0.05);padding-top:0.75rem">
                        <div class="checkbox-wrap">
                            <input type="checkbox" id="cf-terms" onchange="toggleSubmit()">
                            <label for="cf-terms">أوافق على <a href="terms.html" target="_blank">الشروط والأحكام</a></label>
                        </div>
                    </div>

                    <button type="submit" onclick="submitOrder()" class="btn btn-primary" id="submit-btn" disabled style="margin-top:0.5rem">
                        تأكيد الطلب
                    </button>
                    <p style="color:#555;font-size:0.8rem;text-align:center">سيتم التواصل معك خلال 24 ساعة</p>
                </form>
            </div>
        </div>
    </div>

    <!-- Success -->
    <div id="success-page" style="display:none">
        <div style="max-width:550px;margin:2rem auto">
            <div class="card fade-in" style="text-align:center;padding:3rem 2rem">
                <div class="success-icon">✅</div>
                <h2 style="font-size:1.8rem;font-weight:900;margin-bottom:0.5rem">تم استلام طلبك!</h2>
                <p style="color:#888;margin-bottom:0.25rem">رقم الطلب: <span id="order-id" style="color:#f68720;font-weight:700;font-size:1.1rem" dir="ltr"></span></p>
                <p style="color:#888;margin-bottom:2rem">تم إرسال الفاتورة والتفاصيل إلى بريدك الإلكتروني</p>

                <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap">
                    <button onclick="downloadInvoice()" class="btn btn-success" style="padding:0.85rem 1.5rem">
                        📄 تحميل الفاتورة PDF
                    </button>
                </div>
                <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-top:1rem">
                    <a href="packages.html" class="btn btn-ghost" style="padding:0.6rem 1.5rem;font-size:0.85rem">العودة للباقات</a>
                    <a href="index.html" class="btn btn-ghost" style="padding:0.6rem 1.5rem;font-size:0.85rem">الرئيسية</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>
<script>
const CFG = {
    apiKey: "AIzaSyBCP30snA8NGU5PDk6m4Vt_fvYXcxSvem8",
    authDomain: "summ3a-3fe32.firebaseapp.com",
    projectId: "summ3a-3fe32",
    storageBucket: "summ3a-3fe32.firebasestorage.app",
    messagingSenderId: "587094312862",
    appId: "1:587094312862:web:ed31e9cf4e97af846ef88f"
};
firebase.initializeApp(CFG);
const db = firebase.firestore();

const PACKAGES = {
    launch: {
        name: 'الانطلاقة', price: '$550', duration: 'لمدة شهرين', badge: 'أساسي',
        features: ['حساب انستقرام', 'حساب تيك توك', '16 Reels احترافية', '24 منشور ثابت', 'نسخ محتوى', 'تصوير باستديو', 'استخدام الذكاء الاصطناعي', 'تقرير شهري', 'إدارة إعلانات ممولة']
    },
    professional: {
        name: 'المحترف', price: '$900', duration: 'لمدة 3 أشهر', badge: 'الأكثر مبيعاً',
        features: ['حساب انستقرام', 'حساب تيك توك', '70 Reel احترافية', '50 منشور ثابت', '10 منشور متحرك', 'تصوير احترافي', 'مونتاج فيديو', 'تصميم هوية', 'نسخ محتوى', 'تصوير باستديو', 'استخدام الذكاء الاصطناعي', 'تقرير شهري', 'إدارة إعلانات ممولة']
    },
    elite: {
        name: 'النخبة', price: '$2500', duration: 'لمدة 4 أشهر', badge: 'حصرية',
        features: ['حساب انستقرام', 'حساب تيك توك', '100 Reel احترافية', '60 منشور ثابت', '20 منشور متحرك', 'تصوير احترافي', 'مونتاج فيديو', 'تصميم هوية كاملة', 'نسخ محتوى', 'تصوير باستديو', 'استخدام الذكاء الاصطناعي', 'تقرير شهري', 'إدارة إعلانات ممولة', 'رسوم متحركة']
    },
    vip: {
        name: 'VIP مخصصة', price: 'مخصص', duration: 'حسب احتياجك', badge: '💎',
        features: ['باقة مصممة خصيصاً لاحتياجات مشروعك', 'تواصل معنا لمناقشة الخطط والأهداف']
    }
};

const urlParams = new URLSearchParams(window.location.search);
const pkgKey = urlParams.get('package') || 'launch';
const pkg = PACKAGES[pkgKey] || PACKAGES.launch;

let orderDocId = null;
let orderData = null;

// Fill package info
document.getElementById('pkg-name').textContent = pkg.name;
document.getElementById('pkg-price').textContent = pkg.price;
document.getElementById('pkg-duration').textContent = pkg.duration;
document.getElementById('pkg-badge').textContent = pkg.badge;
document.getElementById('pkg-badge').style.display = 'inline-block';

const featuresEl = document.getElementById('pkg-features');
pkg.features.forEach(f => {
    const d = document.createElement('div');
    d.className = 'feature-item';
    d.innerHTML = '<span class="check">✓</span> ' + f;
    featuresEl.appendChild(d);
});

// Invoice preview
document.getElementById('inv-service').textContent = 'باقة ' + pkg.name;
document.getElementById('inv-duration').textContent = pkg.duration;
document.getElementById('inv-total').textContent = pkg.price;

function toggleSubmit() {
    document.getElementById('submit-btn').disabled = !document.getElementById('cf-terms').checked;
}

function submitOrder() {
    const name = document.getElementById('cf-name').value.trim();
    const phone = document.getElementById('cf-phone').value.trim();
    const email = document.getElementById('cf-email').value.trim();
    const notes = document.getElementById('cf-notes').value.trim();

    if (!name) { alert('الرجاء إدخال الاسم'); return; }
    if (!phone) { alert('الرجاء إدخال رقم الجوال'); return; }
    if (!email) { alert('الرجاء إدخال البريد الإلكتروني'); return; }
    if (!document.getElementById('cf-terms').checked) { alert('الرجاء الموافقة على الشروط'); return; }

    const btn = document.getElementById('submit-btn');
    btn.textContent = 'جاري الإرسال...';
    btn.disabled = true;

    orderData = {
        name, phone, email, notes,
        package: pkg.name,
        packageKey: pkgKey,
        price: pkg.price,
        source: 'checkout',
        status: 'new',
        createdAt: new Date().toISOString()
    };

    db.collection('leads').add(orderData).then(docRef => {
        orderDocId = docRef.id;
        orderData.id = docRef.id;

        // إرسال الفاتورة PDF (jsPDF)
        generateInvoice(orderData);

        // إرسال إيميل تأكيد عبر EmailJS
        sendConfirmationEmail(orderData);

        // شاشة النجاح
        document.getElementById('checkout-page').style.display = 'none';
        document.getElementById('success-page').style.display = 'block';
        document.getElementById('order-id').textContent = docRef.id.slice(-8).toUpperCase();
    }).catch(err => {
        alert('حدث خطأ: ' + err.message);
        btn.textContent = 'تأكيد الطلب';
        btn.disabled = false;
    });
}

// ── فاتورة PDF ──
function generateInvoice(data) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

    const orange = [246, 135, 32];
    const darkBg = [20, 20, 20];
    const lightText = [200, 200, 200];

    // خلفية
    doc.setFillColor(...darkBg);
    doc.rect(0, 0, 210, 297, 'F');

    // شريط علوي برتقالي
    doc.setFillColor(...orange);
    doc.rect(0, 0, 210, 8, 'F');

    // شعار "سمعة"
    doc.setFont('Helvetica', 'bold');
    doc.setFontSize(28);
    doc.setTextColor(...orange);
    doc.text('S U M M 3 A', 105, 30, { align: 'center' });
    doc.setFontSize(10);
    doc.setTextColor(...lightText);
    doc.text('سمعة للتسويق والتصميم', 105, 38, { align: 'center' });

    // خط فاصل
    doc.setDrawColor(...orange);
    doc.setLineWidth(0.5);
    doc.line(20, 45, 190, 45);

    // عنوان الفاتورة
    doc.setFontSize(18);
    doc.setTextColor(...orange);
    doc.text('فاتورة / Invoice', 105, 58, { align: 'center' });

    // رقم الفاتورة
    doc.setFontSize(10);
    doc.setTextColor(...lightText);
    const invoiceNum = 'INV-' + data.id.slice(-8).toUpperCase();
    doc.text('رقم الفاتورة: ' + invoiceNum, 20, 70);
    doc.text('التاريخ: ' + new Date().toLocaleDateString('ar-SA'), 190, 70, { align: 'right' });

    // معلومات العميل
    doc.setFontSize(11);
    doc.setTextColor(...orange);
    doc.text('معلومات العميل', 20, 85);
    doc.setTextColor(...lightText);
    doc.setFontSize(10);
    doc.text('الاسم: ' + data.name, 20, 94);
    doc.text('الجوال: ' + data.phone, 20, 101);
    if (data.email) doc.text('البريد: ' + data.email, 20, 108);

    // تفاصيل الفاتورة
    doc.setFontSize(11);
    doc.setTextColor(...orange);
    doc.text('تفاصيل الفاتورة', 20, 125);

    // جدول
    doc.setFillColor(30, 30, 30);
    doc.rect(20, 130, 170, 8, 'F');
    doc.setFontSize(9);
    doc.setTextColor(...orange);
    doc.text('الوصف', 25, 136);
    doc.text('المدة', 120, 136);
    doc.text('المبلغ', 170, 136, { align: 'right' });

    doc.setDrawColor(60, 60, 60);
    doc.line(20, 139, 190, 139);

    doc.setTextColor(...lightText);
    doc.text('باقة ' + data.package, 25, 147);
    doc.text(PACKAGES[data.packageKey]?.duration || '-', 120, 147);
    doc.text(data.price, 170, 147, { align: 'right' });

    doc.line(20, 153, 190, 153);

    // المجموع
    doc.setFontSize(12);
    doc.setTextColor(...orange);
    doc.setFont('Helvetica', 'bold');
    doc.text('الإجمالي', 120, 164);
    doc.text(data.price, 170, 164, { align: 'right' });

    // الشروط
    doc.setFontSize(8);
    doc.setTextColor(100, 100, 100);
    doc.setFont('Helvetica', 'normal');
    doc.text('شكراً لثقتكم بسمعة', 105, 250, { align: 'center' });
    doc.text('تم إنشاء هذه الفاتورة إلكترونياً', 105, 256, { align: 'center' });

    doc.save(invoiceNum + '.pdf');
}

// ── إيميل تأكيد (EmailJS) ──
function sendConfirmationEmail(data) {
    // يحتاج تسجيل في EmailJS (مجاني)
    // 1. سجل في https://www.emailjs.com
    // 2. أضف خدمة بريد (Gmail / Outlook)
    // 3. أنشئ قالب بريد اسمه "order_confirmation"
    // 4. ضع المفاتيح تحت
    const EMAILJS_SERVICE_ID = 'YOUR_SERVICE_ID';
    const EMAILJS_TEMPLATE_ID = 'YOUR_TEMPLATE_ID';
    const EMAILJS_PUBLIC_KEY = 'YOUR_EMAILJS_PUBLIC_KEY';

    if (EMAILJS_PUBLIC_KEY === 'YOUR_EMAILJS_PUBLIC_KEY') return;

    const params = {
        to_name: data.name,
        to_email: data.email,
        package_name: data.package,
        package_price: data.price,
        order_id: data.id.slice(-8).toUpperCase(),
        order_date: new Date().toLocaleDateString('ar-SA'),
        phone: data.phone,
        message: 'تم استلام طلبك بنجاح. سنتواصل معك قريباً.'
    };

    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, params).then(() => {
        console.log('تم إرسال الإيميل');
    }).catch(err => {
        console.warn('فشل إرسال الإيميل (يمكنك تجاهل هذا):', err);
    });
}

// ── تحميل الفاتورة ──
function downloadInvoice() {
    if (orderData) generateInvoice(orderData);
}

// ── Auto-fill from questionnaire ──
const pendingData = JSON.parse(localStorage.getItem('checkout_pending') || 'null');
if (pendingData) {
    document.getElementById('cf-name').value = pendingData.name || '';
    document.getElementById('cf-phone').value = pendingData.phone || '';
    document.getElementById('cf-email').value = pendingData.email || '';
    document.getElementById('cf-notes').value = (pendingData.brand ? 'العلامة التجارية: ' + pendingData.brand + '\n' : '') + (pendingData.notes || '');
    document.querySelectorAll('#checkout-form input, #checkout-form textarea').forEach(el => el.readOnly = true);
    document.getElementById('cf-terms').checked = true;
    toggleSubmit();
    localStorage.removeItem('checkout_pending');
    setTimeout(function() {
        document.getElementById('submit-btn').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);
}
</script>
<script src="visit-tracker.js"></script>
</body>
</html>
