<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع الطلب | سمعة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background: #070707; color: #fff; min-height: 100vh; }
        .bg-glow { position: fixed; top: -30%; right: -15%; width: 50%; height: 70%; background: radial-gradient(circle, rgba(246,135,32,0.04), transparent 70%); pointer-events: none; z-index: 0; }

        .card { background: linear-gradient(145deg, #141414, #0a0a0a); border: 1px solid rgba(246,135,32,0.08); border-radius: 1.5rem; padding: 2rem; max-width: 600px; margin: 0 auto; }

        .input { background: #111; border: 1px solid rgba(255,255,255,0.06); border-radius: 1rem; color: #fff; padding: 1rem 1.25rem; width: 100%; transition: all 0.3s ease; font-family: 'Tajawal', sans-serif; font-size: 1rem; }
        .input:focus { outline: none; border-color: #f68720; box-shadow: 0 0 20px rgba(246,135,32,0.08); }

        .btn { padding: 1rem 2rem; border-radius: 1rem; font-weight: 700; font-size: 1rem; transition: all 0.3s ease; cursor: pointer; border: none; font-family: 'Tajawal', sans-serif; }
        .btn-primary { background: linear-gradient(135deg, #f68720, #e0781c); color: #000; width: 100%; }
        .btn-primary:hover { box-shadow: 0 0 30px rgba(246,135,32,0.25); transform: translateY(-2px); }
        .btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #aaa; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-ghost:hover { border-color: #f68720; color: #f68720; }

        .step-line { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 0; position: relative; }
        .step-dot { width: 2.5rem; height: 2.5rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; flex-shrink: 0; }
        .step-dot.done { background: #22c55e; color: #000; }
        .step-dot.active { background: #f68720; color: #000; }
        .step-dot.pending { background: rgba(255,255,255,0.06); color: #555; }
        .step-line::before { content: ''; position: absolute; right: 1.15rem; top: 2.5rem; width: 2px; height: calc(100% - 0.5rem); background: rgba(255,255,255,0.04); }
        .step-line:last-child::before { display: none; }
        .step-info { flex: 1; }
        .step-title { font-weight: 700; }
        .step-desc { color: #888; font-size: 0.85rem; }

        .status-badge { display: inline-block; padding: 0.3rem 1rem; border-radius: 999px; font-weight: 700; font-size: 0.85rem; }
        .status-new { background: rgba(246,135,32,0.12); color: #f68720; }
        .status-contacted { background: rgba(59,130,246,0.12); color: #3b82f6; }
        .status-interested { background: rgba(139,92,246,0.12); color: #8b5cf6; }
        .status-subscribed { background: rgba(34,197,94,0.12); color: #22c55e; }
        .status-cancelled { background: rgba(239,68,68,0.12); color: #ef4444; }

        .fade-in { animation: fi 0.4s ease both; }
        @keyframes fi { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 640px) { .card { padding: 1.25rem; } }
    </style>
</head>
<body>
<div class="bg-glow"></div>

<div class="page" style="position:relative;z-index:1;padding:2rem 1rem">

    <!-- Header -->
    <div class="fade-in" style="display:flex;align-items:center;gap:1rem;margin-bottom:2rem;max-width:600px;margin-left:auto;margin-right:auto">
        <a href="checkout.html" style="color:#666;text-decoration:none;font-size:1.2rem">→</a>
        <img src="images/3.png" alt="" style="width:2.5rem;height:2.5rem;border-radius:0.6rem;border:2px solid rgba(246,135,32,0.15)">
        <div><h1 style="font-size:1.3rem;font-weight:900">تتبع الطلب</h1></div>
    </div>

    <!-- Search -->
    <div id="search-screen">
        <div class="card fade-in" style="text-align:center">
            <div style="font-size:3rem;margin-bottom:1rem">🔍</div>
            <h2 style="font-size:1.5rem;font-weight:900;margin-bottom:0.5rem">أدخل بريدك الإلكتروني</h2>
            <p style="color:#888;margin-bottom:1.5rem">لتتبع حالة طلبك</p>
            <div style="display:flex;flex-direction:column;gap:1rem">
                <input type="email" id="track-email" class="input" placeholder="البريد الإلكتروني المستخدم في الطلب" onkeydown="if(event.key==='Enter')trackOrder()">
                <button onclick="trackOrder()" class="btn btn-primary">بحث</button>
            </div>
            <div id="track-error" style="color:#ef4444;font-size:0.85rem;margin-top:1rem;display:none"></div>
        </div>
    </div>

    <!-- Result -->
    <div id="result-screen" style="display:none">
        <div class="card fade-in">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem">
                <div>
                    <h2 style="font-weight:900" id="res-name">-</h2>
                    <p style="color:#888;font-size:0.85rem" id="res-package">-</p>
                </div>
                <div id="res-status"></div>
            </div>

            <div style="border-top:1px solid rgba(255,255,255,0.05);padding-top:1.5rem">
                <div style="font-weight:700;margin-bottom:1rem">حالة الطلب</div>
                <div id="timeline"></div>
            </div>

            <div style="border-top:1px solid rgba(255,255,255,0.05);padding-top:1.5rem;margin-top:1rem">
                <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center">
                    <a href="packages.html" class="btn btn-primary" style="width:auto;padding:0.75rem 1.5rem">تصفح الباقات</a>
                    <button onclick="backToSearch()" class="btn btn-ghost" style="padding:0.75rem 1.5rem">بحث جديد</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>
<script>
const CFG = {
    apiKey: "AIzaSyBCP30snA8NGU5PDk6m4Vt_fvYXcxSvem8",
    authDomain: "summ3a-3fe32.firebaseapp.com",
    projectId: "summ3a-3fe32",
    storageBucket: "summ3a-3fe32.firebasestorage.app",
    messagingSenderId: "587094312862",
    appId: "1:587094312862:web:ed31e9cf4e97af846ef88f"
};
firebase.initializeApp(CFG);
const db = firebase.firestore();

const STATUS_MAP = {
    new: { label: 'قيد المراجعة', desc: 'تم استلام طلبك وهو قيد المراجعة', order: 0 },
    contacted: { label: 'تم التواصل', desc: 'فريقنا تواصل معك', order: 1 },
    interested: { label: 'جاري التقييم', desc: 'نقوم بتقييم احتياجاتك', order: 2 },
    subscribed: { label: 'تم التفعيل', desc: 'تم تفعيل باقتك بنجاح ✓', order: 3 },
    cancelled: { label: 'ملغي', desc: 'تم إلغاء الطلب', order: -1 }
};

function trackOrder() {
    const email = document.getElementById('track-email').value.trim().toLowerCase();
    const errEl = document.getElementById('track-error');

    if (!email || !email.includes('@')) {
        errEl.textContent = 'الرجاء إدخال بريد إلكتروني صحيح';
        errEl.style.display = 'block';
        return;
    }

    errEl.style.display = 'none';
    document.getElementById('track-error').textContent = 'جاري البحث...';
    document.getElementById('track-error').style.display = 'block';
    document.getElementById('track-error').style.color = '#888';

    db.collection('leads').where('email', '==', email).orderBy('createdAt', 'desc').limit(1).get().then(snap => {
        if (snap.empty) {
            document.getElementById('track-error').textContent = 'لم يتم العثور على طلب بهذا البريد';
            document.getElementById('track-error').style.display = 'block';
            document.getElementById('track-error').style.color = '#ef4444';
            return;
        }

        const d = snap.docs[0].data();
        d.id = snap.docs[0].id;
        showResult(d);
    }).catch(err => {
        document.getElementById('track-error').textContent = 'خطأ: ' + err.message;
        document.getElementById('track-error').style.display = 'block';
        document.getElementById('track-error').style.color = '#ef4444';
    });
}

function showResult(d) {
    document.getElementById('search-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';

    document.getElementById('res-name').textContent = d.name || 'عميل';
    document.getElementById('res-package').textContent = 'باقة ' + (d.package || 'غير محددة') + ' | ' + (d.price || '');

    const curStatus = d.status || 'new';
    const s = STATUS_MAP[curStatus] || STATUS_MAP.new;

    document.getElementById('res-status').innerHTML = '<span class="status-badge status-' + curStatus + '">' + s.label + '</span>';

    // Timeline
    let timelineHtml = '';
    const steps = ['new', 'contacted', 'interested', 'subscribed'];
    const currentOrder = s.order;

    steps.forEach(key => {
        const st = STATUS_MAP[key];
        let state = 'pending';
        if (key === curStatus && key !== 'subscribed') state = 'active';
        else if (currentOrder >= st.order) state = 'done';

        timelineHtml += `<div class="step-line">
            <div class="step-dot ${state}">${state === 'done' ? '✓' : state === 'active' ? '●' : st.order + 1}</div>
            <div class="step-info">
                <div class="step-title" style="color:${state === 'pending' ? '#555' : '#fff'}">${st.label}</div>
                <div class="step-desc">${st.desc}</div>
            </div>
        </div>`;
    });

    if (curStatus === 'cancelled') {
        timelineHtml += `<div class="step-line">
            <div class="step-dot done" style="background:#ef4444">✕</div>
            <div class="step-info">
                <div class="step-title" style="color:#ef4444">ملغي</div>
                <div class="step-desc">تم إلغاء الطلب</div>
            </div>
        </div>`;
    }

    document.getElementById('timeline').innerHTML = timelineHtml;
}

function backToSearch() {
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('search-screen').style.display = 'block';
    document.getElementById('track-email').value = '';
    document.getElementById('track-error').style.display = 'none';
}
</script>
</body>
</html>
